[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra"
version = "1.0.0"
description = "Local-first open-source AI agent team with multi-agent orchestration and 4-layer anti-hallucination verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ritik Suman"},
]
maintainers = [
    {name = "Ritik Suman", email = "ritik@example.com"},
]
keywords = [
    "ai-agent",
    "local-llm",
    "offline-ai",
    "open-source-ai",
    "autonomous-agents",
    "multi-agent",
    "mcp",
    "model-context-protocol",
    "anti-hallucination",
    "privacy-first",
    "self-hosted",
    "ollama",
    "appimage",
    "inno-setup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "requests>=2.32.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.6.0",
    "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
]
tools = [
    "chromadb>=0.4.0",
    "neo4j>=5.20.0",
    "kuzu>=0.4.0",
]
web = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
]

[project.scripts]
vajra = "agent.core.cli_main:main"

[project.urls]
Homepage = "https://github.com/Ritiksuman07/Vajra"
Documentation = "https://github.com/Ritiksuman07/Vajra#readme"
Repository = "https://github.com/Ritiksuman07/Vajra"
Changelog = "https://github.com/Ritiksuman07/Vajra/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Ritiksuman07/Vajra/issues"
"Security" = "https://github.com/Ritiksuman07/Vajra/security/policy"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "cli*", "ui*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"agent" = ["mcp/*.json"]
"cli" = ["tui/templates/*"]

[tool.setuptools.dynamic]
readme = {file = "README.md"}

# --- GitHub Actions PyPI Publish Configuration ---
# This section is used by .github/workflows/publish.yml
# to automatically publish to PyPI on tagged releases.

# PyPI Token (store as GitHub Secret)
# Name: PYPI_API_TOKEN
# Scope: Upload package to PyPI

# To generate token:
# 1. Go to https://pypi.org/manage/account/
# 2. Click "Add API token"
# 3. Name: "github-actions-publish"
# 4. Scope: Entire account (or specific project)
# 5. Copy token and add to GitHub repo secrets

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["B008", "B905"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.coverage.run]
source = ["agent", "cli"]
omit = ["tests/*", "node_modules/*"]