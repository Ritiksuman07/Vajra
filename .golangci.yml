run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  misspell:
    # The prose in this project (README, docs, comments) is written in British
    # English throughout, so the linter is set to match it. Otherwise every
    # "behaviour" and "labelled" is reported as a typo.
    locale: UK

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
