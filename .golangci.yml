run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  misspell:
    # The prose here (README, docs, comments) is British, but Go code is full
    # of American identifiers we cannot rename — lipgloss.Color, color.RGBA —
    # and the linter checks whole lines, not just comments. So keep the US
    # locale (which leaves Color alone) and allow the British words we write on
    # purpose, one by one.
    locale: US
    ignore-words:
      - analyses
      - behaviour
      - finalise
      - labelled
      - serialise
      - serialised
      - serialises
      - summarise
      - summarises
      - synthesise
      - synthesised
      - synthesising

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
