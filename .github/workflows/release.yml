name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v1.2.0 (required: a manual run has no tag to read)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and check the version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version || github.ref_name }}"
          v="${raw#v}"
          # A tag push always passes. A manual run has to name a real version,
          # otherwise the artifacts would be stamped with the branch name and the
          # release would be created against a branch instead of a tag.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${raw}' is not a release version. Set the 'version' input to a tag such as v1.2.0."
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "releasing ${v}"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          NAME="vajra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          # Stamp the version from the tag into the binary as well, so every
          # artifact reports the release it came from rather than whatever
          # main.go happens to say.
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$NAME" .
          echo "NAME=$NAME" >> $GITHUB_ENV

      - name: Package (tar.gz / zip)
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "$NAME.zip" "$NAME" README.md LICENSE CHANGELOG.md
            ARTIFACT="$NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME" README.md LICENSE CHANGELOG.md
            ARTIFACT="$NAME.tar.gz"
          fi
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  windows-installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    needs: [preflight, build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Build binary
        shell: pwsh
        run: |
          $v = "${{ needs.preflight.outputs.version }}"
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/vajra.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $v = "${{ needs.preflight.outputs.version }}"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$v" packaging\windows\vajra.iss

      - name: Checksum installer
        shell: pwsh
        run: |
          $f = "dist/releases/VajraSetup-${{ needs.preflight.outputs.version }}-win-x64.exe"
          $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          # Same shape as the sha256sum files the other artifacts get:
          # "<hash>  <filename>", LF line ending, no BOM.
          [System.IO.File]::WriteAllText("$f.sha256", "$hash  $(Split-Path $f -Leaf)`n")

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/releases/*.exe
            dist/releases/*.exe.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [preflight, build, windows-installer]
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: Vajra v${{ needs.preflight.outputs.version }}
          body_path: packaging/RELEASE-DRAFT.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
