name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          NAME="vajra-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "$NAME" .
          echo "NAME=$NAME" >> $GITHUB_ENV

      - name: Package (tar.gz / zip)
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "$NAME.zip" "$NAME" README.md LICENSE CHANGELOG.md
            ARTIFACT="$NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME" README.md LICENSE CHANGELOG.md
            ARTIFACT="$NAME.tar.gz"
          fi
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  windows-installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Build binary
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/vajra.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$v" packaging\windows\vajra.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/releases/*.exe

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, windows-installer]
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Vajra ${{ github.ref_name }}
          body_path: packaging/RELEASE-DRAFT.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
