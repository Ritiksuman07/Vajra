<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Vajra — local-first AI agent workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#111427"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0" r="0.9">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <font id="f" family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"/>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glowA)"/>
  <rect width="1200" height="340" fill="url(#glowB)"/>

  <!-- shield mark -->
  <g transform="translate(84 74) scale(0.72)">
    <path d="M128 30 l68 28 v58 c0 48 -31 82 -68 104 c-37 -22 -68 -56 -68 -104 v-58 z" fill="url(#acc)" opacity="0.16"/>
    <path d="M128 34 l64 26 v56 c0 46 -29 79 -64 100 c-35 -21 -64 -54 -64 -100 v-56 z" fill="none" stroke="url(#acc)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M138 62 l-42 72 h31 l-15 60 48 -78 h-31 z" fill="url(#bolt)"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="168" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" fill="#e7e9f0" letter-spacing="2">Vajra</text>

  <text x="364" y="212" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="26" fill="#8b93a7" letter-spacing="0.5">Your machine. Your models. Your data.</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#c8cee0">
    <rect x="364" y="242" width="150" height="36" rx="18" fill="#171b25" stroke="#232838"/>
    <text x="439" y="266" text-anchor="middle">local-first</text>

    <rect x="526" y="242" width="150" height="36" rx="18" fill="#171b25" stroke="#232838"/>
    <text x="601" y="266" text-anchor="middle">offline AI</text>

    <rect x="688" y="242" width="186" height="36" rx="18" fill="#171b25" stroke="#232838"/>
    <text x="781" y="266" text-anchor="middle">multi-agent</text>

    <rect x="886" y="242" width="196" height="36" rx="18" fill="#171b25" stroke="#232838"/>
    <text x="984" y="266" text-anchor="middle">single binary</text>
  </g>
</svg>
