<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Vajra — local-first AI agent workspace with a terminal UI, web GUI and REST API over Ollama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#111427"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.08" cy="0" r="0.9">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glowA)"/>
  <rect width="1200" height="360" fill="url(#glowB)"/>

  <!-- shield mark -->
  <g transform="translate(76 66) scale(0.72)">
    <path d="M128 30 l68 28 v58 c0 48 -31 82 -68 104 c-37 -22 -68 -56 -68 -104 v-58 z" fill="url(#acc)" opacity="0.16"/>
    <path d="M128 34 l64 26 v56 c0 46 -29 79 -64 100 c-35 -21 -64 -54 -64 -100 v-56 z" fill="none" stroke="url(#acc)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M138 62 l-42 72 h31 l-15 60 48 -78 h-31 z" fill="url(#bolt)"/>
  </g>

  <!-- wordmark -->
  <text x="350" y="150" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#e7e9f0" letter-spacing="2">Vajra</text>

  <text x="354" y="194" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="25" fill="#8b93a7" letter-spacing="0.4">Your machine. Your models. Your data.</text>

  <text x="354" y="228" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="17" fill="#5d6577">one Go binary · no telemetry · works fully offline</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#c8cee0">
    <rect x="354" y="252" width="130" height="34" rx="17" fill="#151a26" stroke="#232838"/>
    <text x="419" y="274" text-anchor="middle">terminal UI</text>

    <rect x="494" y="252" width="118" height="34" rx="17" fill="#151a26" stroke="#232838"/>
    <text x="553" y="274" text-anchor="middle">web GUI</text>

    <rect x="622" y="252" width="112" height="34" rx="17" fill="#151a26" stroke="#232838"/>
    <text x="678" y="274" text-anchor="middle">REST API</text>

    <rect x="744" y="252" width="146" height="34" rx="17" fill="#151a26" stroke="#232838"/>
    <text x="817" y="274" text-anchor="middle">agent swarm</text>

    <rect x="900" y="252" width="222" height="34" rx="17" fill="#151a26" stroke="#2a2340"/>
    <text x="1011" y="274" text-anchor="middle" fill="#b7aaff">4-layer verification</text>
  </g>

  <!-- footer strip -->
  <rect x="0" y="318" width="1200" height="4" fill="url(#acc)" opacity="0.55"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="15" fill="#5d6577">local models via Ollama  ·  multi-agent orchestration  ·  anti-hallucination pipeline  ·  MIT licensed</text>
</svg>
